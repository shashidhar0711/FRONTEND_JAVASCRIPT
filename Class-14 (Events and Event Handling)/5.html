    <script>
      // Q Write a script which fetches the data-color attribute of the card on 
      //double clicking on them and attaches the fetched class to that card.
      // Also changes the data-color attribute to "used"

      let cardList = document.querySelectorAll('.card')
      console.log(cardList)

      for (let i=0; i<cardList.length; i++) {
        cardList[i].addEventListener('click', function(event) {
            console.log(event)
            // console.log(event.target.dataset.color)

            // solution - 1
            // let color = event.target.dataset.color
            // cardList[i].style.background = color

            // solution - 2
            let colorNeedToBeAttach = event.target.getAttribute('data-color')
            event.target.classList.add(colorNeedToBeAttach)
            event.target.setAttribute('data-color', ' ')
        })
        
      }
      
      
    
    </script>
  </body>
