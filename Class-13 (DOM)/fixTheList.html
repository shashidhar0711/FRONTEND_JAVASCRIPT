<!DOCTYPE html>
<html lang = "en">
<head>
    <meta charset = "UTF - 8">
    <meta name = "viewport" content = "width = device - width, initial - scale = 1.0">
    <title>Document</title>
</head>
<body>
    <ul>
        <li>1</li>
        <li>2</li>
        <li>3</li>
        <li>4</li>
        <li>5</li>
        <li>6</li>
        
        <li>8</li>
        <li>9</li>
        <li>10</li>
    </ul>

    <button id="fixBtn">Fix List</button>
    

    <script>
        // Fix the list by inserting the missing element using querySelectorAll and insertBefor

        let selectedBtn =  document.querySelector('#fixBtn')
        console.log(selectedBtn)

        selectedBtn.addEventListener('click', function() {

            let myList = document.querySelector('ul')

            let list = document.querySelectorAll('li')
            console.log(list)

            let indexHas8thElement = list[6]
            console.log(indexHas8thElement)

            let seventhElement = document.createElement('li')
            seventhElement.innerText = '7'

            myList.insertBefore(seventhElement, indexHas8thElement)

        })

    </script>
</body>
</html>
